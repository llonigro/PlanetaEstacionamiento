<section class="cocheras-seccion">

    <div class="level">

        <div class="level-left">

            <div>
                <h2 class="title is-3">
                    Cocheras
                </h2>

                <p class="subtitle is-6">
                    Administrá los espacios de tu estacionamiento
                </p>
            </div>

        </div>

        <div class="level-right">

            <button class="button is-primary" id="btn-agregar-cochera">
                <span class="icon">
                    <i class="fas fa-plus"></i>
                </span>

                <span>
                    Agregar cochera
                </span>
            </button>

        </div>

    </div>


    <!-- RESUMEN -->
    <div class="columns is-multiline">

        <div class="column is-3">
            <div class="card">
                <div class="card-content">
                    <p class="heading titulo-azul-petroleo">TOTAL</p>
                    <p class="title titulo-turquesa"><span id="cocheras-total">0</span></p>
                </div>
            </div>
        </div>

        <div class="column is-3">
            <div class="card">
                <div class="card-content">
                    <p class="heading titulo-azul-petroleo">DISPONIBLES</p>
                    <p class="title titulo-turquesa"><span id="cocheras-disponibles">0</span></p>
                </div>
            </div>
        </div>

        <div class="column is-3">
            <div class="card">
                <div class="card-content">
                    <p class="heading titulo-azul-petroleo">OCUPADOS</p>
                    <p class="title titulo-turquesa"><span id="cocheras-ocupadas">0</span></p>
                </div>
            </div>
        </div>

        <div class="column is-3">
            <div class="card">
                <div class="card-content">
                    <p class="heading titulo-azul-petroleo">MANTENIMIENTO</p>
                    <p class="title titulo-turquesa"><span id="cocheras-mantenimiento">0</span></p>
                </div>
            </div>
        </div>

    </div>


    <!-- COCHERAS -->
    <div class="columns is-multiline">

        <div class="column is-12-mobile is-6-tablet is-4-desktop">

            <div class="card cochera-card">

                <div class="card-content">

                    <div class="level">

                        <div class="level-left">
                            <h3 class="title is-4 titulo-azul-petroleo">
                                A-01
                            </h3>
                        </div>

                        <div class="level-right">
                            <span class="tag is-success">
                                Disponible
                            </span>
                        </div>

                    </div>

                    <p class="titulo-azul-petroleo">
                        <strong >Condición:</strong>
                        Buena
                    </p>

                    <p class="titulo-azul-petroleo">
                        <strong>Tipo:</strong>
                        Exterior
                    </p>

                    <button class="button is-light is-fullwidth mt-4">
                        Ver detalles
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- AGREGAR COCHERA -->
    <div class="modal" id="modal-agregar-cochera">

    <!-- Fondo oscuro -->
    <div class="modal-background"></div>


    <!-- Contenido -->
    <div class="modal-card">

        <!-- Header -->
        <header class="modal-card-head">

            <p class="modal-card-title">
                Agregar cochera
            </p>

            <button
                class="delete"
                id="btn-cerrar-modal"
                aria-label="close">
            </button>

        </header>


        <!-- Body -->
        <section class="modal-card-body">

            <form id="formulario-cochera">

                <!-- Nombre -->
                <div class="field">

                    <label class="label">
                        Identificador de la cochera
                    </label>

                    <div class="control">

                        <input
                            class="input"
                            type="text"
                            id="nombre-cochera"
                            placeholder="Ej: A-01"
                            required>

                    </div>

                </div>


                <!-- Tipo -->
                <div class="field">

                    <label class="label">
                        Tipo de cochera
                    </label>

                    <div class="control">

                        <div class="select is-fullwidth is-turquesa">

                            <select id="tipo-cochera">

                                <option value="">
                                    Seleccioná un tipo
                                </option>

                                <option value="techado">
                                    Techado
                                </option>

                                <option value="exterior">
                                    Exterior
                                    
                                </option>

                            </select>

                        </div>

                    </div>

                </div>


                <!-- Condición -->
                <div class="field">

                    <label class="label">
                        Condición
                    </label>

                    <div class="control">

                        <div class="select is-fullwidth is-turquesa">

                            <select id="condicion-cochera">

                                <option value="buena">
                                    Buena
                                </option>

                                <option value="regular">
                                    Regular
                                </option>

                                <option value="mantenimiento">
                                    Necesita mantenimiento
                                </option>

                            </select>

                        </div>

                    </div>

                </div>


                <!-- Descripción -->
                <div class="field">

                    <label class="label">
                        Descripción
                    </label>

                    <div class="control">

                        <textarea
                            class="textarea"
                            id="descripcion-cochera"
                            placeholder="Información adicional">
                        </textarea>

                    </div>

                </div>

            </form>

        </section>


        <!-- Footer -->
        <footer class="modal-card-foot">

            <button
                class="button is-primary"
                id="btn-guardar-cochera">

                Guardar cochera

            </button>

            <button
                class="button"
                id="btn-cancelar-modal">

                Cancelar

            </button>

        </footer>

    </div>

</div>

</section>
