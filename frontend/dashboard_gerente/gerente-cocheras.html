<section class="cocheras-seccion">
  <div class="level">
    <div class="level-left">
      <div>
        <h2 class="title is-3">Cocheras</h2>

        <p class="subtitle is-6">
          Administrá los espacios de tu estacionamiento
        </p>
      </div>
    </div>

    <div class="level-right">
      <button
        class="button is-primary js-modal-trigger"
        data-target="modal-agregar-cochera"
      >
        <span class="icon">
          <i class="fas fa-plus"></i>
        </span>

        <span> Agregar cochera </span>
      </button>
    </div>
  </div>

  <!-- RESUMEN -->
  <div class="columns is-multiline">
    <div class="column is-3">
      <div class="card">
        <div class="card-content">
          <p class="heading titulo-azul-petroleo">TOTAL</p>
          <p class="title titulo-turquesa">
            <span id="cocheras-total">0</span>
          </p>
        </div>
      </div>
    </div>

    <div class="column is-3">
      <div class="card">
        <div class="card-content">
          <p class="heading titulo-azul-petroleo">DISPONIBLES</p>
          <p class="title titulo-turquesa">
            <span id="cocheras-disponibles">0</span>
          </p>
        </div>
      </div>
    </div>

    <div class="column is-3">
      <div class="card">
        <div class="card-content">
          <p class="heading titulo-azul-petroleo">OCUPADOS</p>
          <p class="title titulo-turquesa">
            <span id="cocheras-ocupadas">0</span>
          </p>
        </div>
      </div>
    </div>
  </div>

  <div class="linea-divisoria-cocheras"></div>

  <!-- COCHERAS -->
  <div class="columns is-multiline" id="contenedor-cocheras">
    <div class="column is-12-mobile is-6-tablet is-4-desktop">
      <div class="card cochera-card">
        <div class="card-content">
          <div class="level">
            <div class="level-left">
              <h3 class="title is-4 titulo-azul-petroleo">01</h3>
            </div>

            <div class="level-right">
              <span class="tag is-success"> Disponible </span>
            </div>
          </div>

          <p class="titulo-azul-petroleo">
            <strong>Condición:</strong>
            Buena
          </p>

          <p class="titulo-azul-petroleo">
            <strong>Tipo:</strong>
            Exterior
          </p>

          <button
            class="button is-light is-fullwidth mt-4 js-modal-trigger"
            data-target="modal-editar-cochera"
          >
            Ver detalles
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- AGREGAR COCHERA -->
  <div class="modal" id="modal-agregar-cochera">
    <!-- Fondo -->
    <div class="modal-background"></div>

    <!-- Contenido -->
    <div class="modal-card">
      <!-- Header -->
      <header class="modal-card-head">
        <p class="modal-card-title">Agregar cochera</p>

        <button
          class="delete js-modal-close"
          id="btn-cerrar-modal"
          aria-label="close"
        ></button>
      </header>

      <!-- Body -->
      <section class="modal-card-body">
        <form id="formulario-cochera">
          <!-- Nombre -->
          <div class="field">
            <label class="label"> Identificador de la cochera </label>

            <div class="control">
              <input
                class="input"
                type="text"
                id="numero-cochera"
                placeholder="Ej: 1"
                required
              />
            </div>
          </div>

          <!-- Tipo -->
          <div class="field">
            <label class="label"> Tipo de cochera </label>

            <div class="control">
              <div class="select is-fullwidth is-turquesa">
                <select id="tipo-cochera">
                  <option value="">Seleccioná un tipo</option>

                  <option value="techado">Techado</option>

                  <option value="descubierto">Descubierto</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Estado -->
          <div class="field">
            <label class="label"> Estado </label>

            <div class="control">
              <div class="select is-fullwidth is-turquesa">
                <select id="estado-cochera">
                  <option value="buen estado">Bueno</option>

                  <option value="mal estado">Malo</option>
                </select>
              </div>
            </div>
          </div>

          <div class="field">
            <label class="label"> Clima </label>

            <div class="control">
              <div class="select is-fullwidth">
                <select id="clima-cochera" required>
                  <option value="">Seleccioná una condición climática</option>

                  <option value="frio">Frío</option>

                  <option value="templado">Templado</option>

                  <option value="caluroso">Caluroso</option>
                </select>
              </div>
            </div>
          </div>
        </form>
      </section>

      <!-- Footer -->
      <footer class="modal-card-foot">
        <button
          type="submit"
          class="button is-primary"
          form="formulario-cochera"
          id="btn-guardar-cochera"
        >
          Guardar cochera
        </button>

        <button class="button js-modal-close" id="btn-cancelar-modal">
          Cancelar
        </button>
      </footer>
    </div>
  </div>
</section>

<!-- TEMPLATE TARJETA COCHERAS -->

<template id="plantilla-cochera">
  <div class="column is-12-mobile is-6-tablet is-4-desktop">
    <div class="card cochera-card">
      <div class="card-content">
        <h3 class="title is-4 titulo-azul-petroleo js-numero"></h3>

        <p class="titulo-azul-petroleo">
          Condición:
          <span class="js-estado titulo-turquesa"></span>
        </p>

        <p class="titulo-azul-petroleo">
          Tipo:
          <span class="js-tipo titulo-turquesa"></span>
        </p>

        <p class="titulo-azul-petroleo">
          Clima:
          <span class="js-clima titulo-turquesa"></span>
        </p>

        <button class="button is-light is-fullwidth mt-4 btn-detalles">
          Ver detalles
        </button>
      </div>
    </div>
  </div>
</template>

<!-- MODAL DETALLES / EDICIÓN DE COCHERA -->

<div class="modal" id="modal-detalles-cochera">
  <div class="modal-background"></div>

  <div class="modal-card">
    <!-- HEADER -->

    <header class="modal-card-head">
      <p class="modal-card-title" id="titulo-modal-cochera">
        Detalles de la cochera
      </p>

      <button
        class="delete"
        id="btn-cerrar-detalles-cochera"
        aria-label="close"
      ></button>
    </header>

    <!-- BODY -->

    <section class="modal-card-body">
      <!-- NÚMERO -->

      <div class="field">
        <label class="label"> Número </label>

        <div class="control">
          <input
            class="input"
            id="detalle-numero-cochera"
            type="number"
            disabled
          />
        </div>
      </div>

      <!-- TIPO -->

      <div class="field">
        <label class="label"> Tipo </label>

        <div class="control">
          <div class="select is-fullwidth">
            <select id="detalle-tipo-cochera" disabled>
              <option value="techado">Techado</option>

              <option value="descubierto">Descubierto</option>
            </select>
          </div>
        </div>
      </div>

      <!-- ESTADO -->

      <div class="field">
        <label class="label"> Estado </label>

        <div class="control">
          <div class="select is-fullwidth">
            <select id="detalle-estado-cochera" disabled>
              <option value="buen estado">Buen estado</option>

              <option value="mal estado">Mal estado</option>
            </select>
          </div>
        </div>
      </div>

      <!-- CLIMA -->

      <div class="field">
        <label class="label"> Clima </label>

        <div class="control">
          <div class="select is-fullwidth">
            <select id="detalle-clima-cochera" disabled>
              <option value="frio">Frío</option>

              <option value="templado">Templado</option>

              <option value="caluroso">Caluroso</option>
            </select>
          </div>
        </div>
      </div>
    </section>

    <!-- FOOTER -->

    <footer class="modal-card-foot">
      <!-- BOTONES DEL MODO DETALLES -->

      <div id="botones-detalles-cochera">
        <button class="button is-warning mr-2" id="btn-editar-cochera">
          <span class="icon">
            <i class="fas fa-pen"></i>
          </span>

          <span> Editar </span>
        </button>

        <button class="button is-danger" id="btn-borrar-cochera">
          <span class="icon">
            <i class="fas fa-trash"></i>
          </span>

          <span> Borrar </span>
        </button>
      </div>

      <!-- BOTONES DEL MODO EDICIÓN -->

      <div id="botones-edicion-cochera" class="is-hidden">
        <button class="button is-success mr-2" id="btn-aceptar-edicion-cochera">
          <span class="icon">
            <i class="fas fa-check"></i>
          </span>

          <span> Aceptar </span>
        </button>

        <button class="button" id="btn-cancelar-edicion-cochera">
          <span class="icon">
            <i class="fas fa-xmark"></i>
          </span>

          <span> Cancelar </span>
        </button>
      </div>
    </footer>
  </div>
</div>
