<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planeta Estacionamiento</title>

    <!-- Icono de la pestaña -->
    <link rel="icon" type="image/png" href="img/icono.png">

    <!-- Agrego Font Awesome para los íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Agrego Bulma CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">

    <!-- Agrego el archivo de estilos -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header class="header">
        <!-- Navbar comienza -->
        <nav class="navbar navbar-color" role="navigation" aria-label="main navigation">
            <div class="container is-fluid">

                <!-- Logo y nombre -->
                <div class="navbar-brand">
                    <a class="navbar-item" href="#">
                    <img src="img/logo.png" alt="Logo Planeta Estacionamiento" style="max-height: 70px;" class="logo-icono mr-0">
            
                <div class="logo-texto-contenedor">
                    <span class="logo-texto-principal">Planeta</span>
                    <span class="logo-texto-secundario">Estacionamiento</span>
                </div>
                </a>

                <!-- Botón de menú 'hamburguesa' -->
                    <a role="button" class="navbar-burger" aria-label="menu hamburguesa" aria-expanded="false" data-target="navbarItems">
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    </a>
                </div>

                <!-- Elementos del menú -->
                <div id="navbarItems" class="navbar-menu">
                    <div class="navbar-start">

                    <a class="navbar-item" aria-label="Inicio" href="inicio.html">
                        <i class="fas fa-home" aria-hidden="true"></i> 
                        Inicio
                    </a>

                    <a class="navbar-item" aria-label="Servicios" href="servicios.html">
                        <i class="fas fa-concierge-bell" aria-hidden="true"></i>
                        Servicios
                    </a>

                     <a class="navbar-item" aria-label="Tarifas" href="tarifas.html">
                        <i class="fas fa-dollar-sign" aria-hidden="true"></i>
                        Tarifas
                    </a>
                   
                    <div class="navbar-item has-dropdown is-hoverable">
                        <a class="navbar-link">
                        Más
                        </a>

                        <div class="navbar-dropdown is-boxed ">
                        <a class="navbar-item" aria-label="Nosotros" href="nosotros.html">
                            <i class="fas fa-users" aria-hidden="true"></i>
                            Nosotros
                        </a>
                        <a class="navbar-item" aria-label="Contacto" href="contacto.html">
                            <i class="fas fa-envelope" aria-hidden="true"></i>
                            Contacto
                        </a>
                        </div>
                    </div>
                    </div>

                    <div class="navbar-end">
                    <div class="navbar-item">
                        <div class="buttons">
                        <a id="registrarse" class="button is-primary js-modal-trigger" data-target="menu-registro">
                            <strong>Registrarse</strong>
                        </a>
                        <a id="iniciar-sesion" class="button is-light js-modal-trigger" data-target="menu-login">
                            Iniciar Sesión
                        </a>
                        </div>
                    </div>
                    </div>
                </div>
            </div>
        </nav>
        <!-- Navbar termina -->

        <!-- Menu de Registro -->
        <div id="menu-registro" class="modal">
            <div class="modal-background is-transparent"></div>
            <div class="modal-content">
                <div class="box menu-color">

                    <div class="mb-2">
                        <h2 class="title is-4 mb-2">Creá tu cuenta</h2>
                        <hr class="linea-divisoria-registro my-3">
                    </div>

                    <!-- Usuario -->
                    <div class="field">
                        <label class="label">Usuario</label>
                        <div class="control has-icons-left">
                            <input class="input" type="text" placeholder="Nombre de usuario">
                            <span class="icon is-small is-left">
                                <i class="fas fa-user"></i>
                            </span>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="field">
                        <label class="label">Email</label>
                        <div class="control has-icons-left">
                            <input class="input" type="email" placeholder="correo@ejemplo.com">
                            <span class="icon is-small is-left">
                                <i class="fas fa-solid fa-at"></i>
                            </span>
                        </div>
                    </div>

                    <!-- Contraseña -->
                    <div class="field">   
                        <label class="label">Contraseña</label>
                        <div class="control has-icons-left has-icons-right">
                            <input class="input" id="password" type="password" placeholder="**********">

                            <span class="icon is-small is-left">
                                <i class="fa-solid fa-lock"></i>
                            </span>

                            <span class="icon is-small is-right is-clickable" id="mostrar-contrasenia">
                                <i class="fa-solid fa-eye" id="ojo-icono"></i>
                            </span>

                        </div>
                    </div>

                    <!-- Teléfono -->
                    <div class="field">   
                        <label class="label">Numero Telefónico</label>
                        <div class="control has-icons-left">
                            <input class="input" type="tel" placeholder="+54 9 11 1234-5678">
                            <span class="icon is-small is-left">
                                <i class="fa-solid fa-phone"></i>
                            </span>
                        </div>
                    </div>

                    <div class="buttons">
                    <button id="confirmar-registro" class="button is-success is-rounded">Confirmar</button>
                    <button id="cancelar" class="button is-light is-rounded">Cancelar</button>
                    </div>

                </div>
            <button class="modal-close is-large" aria-label="cerrar"></button>
            </div>

        </div>

        <!-- Menu de Login -->
        <div id="menu-login" class="modal">
            <div class="modal-background is-transparent"></div>
            <div class="modal-content">
                <div class="box menu-color">

                    <div class="mb-2">
                        <h2 class="title is-4 mb-2">Iniciá sesión</h2>
                        <hr class="linea-divisoria-registro my-3">
                    </div>

                    <!-- Email -->
                    <div class="field">
                        <label class="label">Email</label>
                        <div class="control has-icons-left">
                            <input class="input" type="email" placeholder="correo@ejemplo.com">
                            <span class="icon is-small is-left">
                                <i class="fas fa-solid fa-at"></i>
                            </span>
                        </div>
                    </div>

                    <!-- Contraseña -->
                    <div class="field">   
                        <label class="label">Contraseña</label>
                        <div class="control has-icons-left has-icons-right">
                            <input class="input" id="password" type="password" placeholder="**********">

                            <span class="icon is-small is-left">
                                <i class="fa-solid fa-lock"></i>
                            </span>

                            <span class="icon is-small is-right is-clickable" id="mostrar-contrasenia">
                                <i class="fa-solid fa-eye" id="ojo-icono"></i>
                            </span>

                        </div>
                    </div>

                    <div class="buttons">
                    <button id="confirmar-sesion" class="button is-success is-rounded">Confirmar</button>
                    <button id="cancelar" class="button is-light is-rounded">Cancelar</button>
                    </div>

                </div>
            <button class="modal-close is-large" aria-label="cerrar"></button>
            </div>
        </div>
    <script src="js/index-scripts.js"></script>
</header>

<!-- Hero empieza -->
<section class="hero is-medium navbar-color">
  <div class="hero-body">
    <div class="container has-text-centered">
      <h1 class="title is-1 has-text-white">
        Asegurá tu lugar desde tu casa.
      </h1>
      <h2 class="subtitle is-4 has-text-white-ter mt-2">
        Encontrá y reservá tu lugar en minutos.
      </h2>
      <div class="buttons is-centered mt-5">
        <a class="button is-white is-medium has-text-weight-bold">Buscar lugar</a>
        <a class="button is-dark is-outlined is-medium" href="nosotros.html">Saber más</a>
      </div>
    </div>
  </div>
</section>
<!-- Hero termina -->
<section class="section">


</section>
</body>
</html>
