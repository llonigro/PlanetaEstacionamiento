<!-- MODAL: Mensú de Registro (utilizado por el navbar) -->
<div id="menu-registro" class="modal">
  <div class="modal-background is-transparent"></div>
  <div class="modal-content">
    <div class="box menu-color">
      <div class="modal-header">
        <h2 class="title is-4 modal-titulo">Creá tu cuenta</h2>

        <hr />
      </div>

      <!-- Usuario -->
      <div class="field">
        <label class="label">Usuario</label>
        <div class="control has-icons-left">
          <input id="nombre" class="input" type="text" placeholder="Nombre" />
          <span class="icon is-small is-left">
            <i class="fas fa-user"></i>
          </span>
          <p id="error-nombre" class="help is-danger"></p>
        </div>
      </div>

      <!-- Email -->
      <div class="field">
        <label class="label">Email</label>
        <div class="control has-icons-left">
          <input
            id="email"
            class="input"
            type="email"
            placeholder="correo@ejemplo.com"
          />
          <span class="icon is-small is-left">
            <i class="fas fa-solid fa-at"></i>
          </span>
          <p id="error-email" class="help is-danger"></p>
        </div>
      </div>

      <!-- Contraseña -->
      <div class="field">
        <label class="label">Contraseña</label>
        <div class="control has-icons-left has-icons-right">
          <input
            id="contrasenia"
            class="input input-password"
            type="password"
            placeholder="**********"
          />

          <span class="icon is-small is-left">
            <i class="fa-solid fa-lock"></i>
          </span>

          <span class="icon is-small is-right is-clickable boton-ojo">
            <i class="fa-solid fa-eye icono-ojo"></i>
          </span>
          <p id="error-contrasenia" class="help is-danger"></p>
        </div>
      </div>

      <div class="field">
        <label class="label">Rol</label>
        <div class="control">
          <div class="select is-fullwidth is-turquesa">
            <select id="rol">
              <option value="cliente">Cliente</option>

              <option value="gerente">Gerente</option>
            </select>
          </div>
          <p id="error-rol" class="help is-danger"></p>
        </div>
      </div>

      <!-- Teléfono -->
      <div class="field">
        <label class="label">Número Telefónico</label>
        <div class="control has-icons-left">
          <input
            id="telefono"
            class="input"
            type="tel"
            placeholder="+54 9 11 1234-5678 (opcional)"
          />
          <span class="icon is-small is-left">
            <i class="fa-solid fa-phone"></i>
          </span>
          <p id="error-telefono" class="help is-danger"></p>
        </div>
      </div>

      <div class="buttons">
        <button id="confirmar-registro" class="button is-success is-rounded">
          Confirmar
        </button>
        <button id="cancelar" class="button is-light is-rounded js-modal-close">
          Cancelar
        </button>
      </div>
    </div>
    <button class="modal-close is-large" aria-label="cerrar"></button>
  </div>
</div>
