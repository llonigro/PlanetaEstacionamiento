<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosotros | Planeta Estacionamiento</title>

    <!-- Icono de la pestaña -->
    <link rel="icon" type="image/png" href="img/icono.png">

    <!-- Agrego Font Awesome para los íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Agrego Bulma CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">

    <!-- Agrego el archivo de estilos -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="header">

    <div id="navbar-placeholder"></div>

    </header>
    <!-- Script para cargar el navbar -->
    <script src="js/navbar-scripts.js"></script>

    <script>
    (async() => {
        try {
            const respuesta = await fetch('navbar.html');
            const data = await respuesta.text();
            document.getElementById('navbar-placeholder').innerHTML = data;

            inicializarScriptsNavbar();
        } catch (error) {
            console.error('Error al cargar el navbar:', error);
        }
    })();
    </script>
</body>
</html>
